<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/></head><body><br># Build the Spring Boot application<br>FROM maven:<a href="tel:3.9.9">3.9.9</a>-eclipse-temurin-17 AS build<br><br>WORKDIR /app<br>COPY . .<br>RUN mvn clean package -DskipTests<br><br># Run the application<br>FROM eclipse-temurin:17-jre<br><br>WORKDIR /app<br>COPY --from=build /app/target/*.jar <a href="http://app.jar">app.jar</a><br><br>EXPOSE <a href="tel:8080">8080</a><br><br>CMD ["java", "-jar", "<a href="http://app.jar">app.jar</a>"]<br></body></html>
